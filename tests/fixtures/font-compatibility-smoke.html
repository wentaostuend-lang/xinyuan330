<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旧字号兼容验证</title>
<link rel="stylesheet" href="../../css/chat-ui.css">
<link rel="stylesheet" href="../../css/settings-font.css">
<style>
body{margin:16px;background:#f8f8fb}button{padding:8px}pre{white-space:pre-wrap;font:14px/1.6 monospace}
#phone-screen{position:relative;width:390px;max-width:100%;height:700px;border:1px solid #ccc;background:white;overflow:hidden}
#font-settings-screen{height:100%}.font-scroll-container{height:calc(100% - 70px);overflow:auto}
#font-settings-screen .font-ios-header{position:relative;padding-top:12px}
#chat-messages .message-bubble{font-size:var(--chat-font-size,13px)}
</style>
<h1>旧字号兼容验证</h1>
<p>加载项目的字体页面、控件与字体代码；设置仅保存在本测试页内存中，不访问用户数据库。</p>
<button id="run" disabled>运行字号兼容检查</button>
<pre id="results">正在加载真实字体页面</pre>
<div id="chat-settings-controls"></div>
<div id="chat-interface-screen"><div id="chat-messages"><div class="message-bubble">聊天字号检查</div></div><textarea id="chat-input">输入框仍为 16px</textarea></div>
<div id="phone-screen"></div>
<style id="test-font-style"></style>
<script>
window.state={activeChatId:'test',globalSettings:{id:'main',globalFontSize:20},chats:{test:{id:'test',name:'测试角色',settings:{fontSize:18},history:[]}}};
window.dynamicFontStyle=document.getElementById('test-font-style');
window.fontWrites=[];
window.db={globalSettings:{put:async value=>fontWrites.push(JSON.parse(JSON.stringify(value)))},appearancePresets:{where:()=>({equals:()=>({toArray:async()=>[]})})}};
window.showToast=()=>{};
window.showScreen=id=>{document.getElementById('results').textContent+='\n返回：'+id;};
window.showChoiceModal=async()=> 'discard';
window.applyScopedCss=()=>{};
window.createMessageElement=async()=>null;
// 两个设置模块还导出其他模块的函数；此页只验证字号预览。
for (const name of ['updateTokenCountDisplay','processMentions','updateBackButtonUnreadCount','getDisplayNameByOriginalName','handlePresetSelectionChange','saveApiPreset','deleteApiPreset']) window[name]=()=>{};
</script>
<script src="../../modules/data/custom-fonts.js"></script>
<script src="../../modules/settings/font-presets.js"></script>
<script src="../../modules/chat/interface-settings.js"></script>
<script src="../../modules/settings/preset-preview-and-exports.js"></script>
<script src="font-compatibility-smoke.js"></script>
</html>
